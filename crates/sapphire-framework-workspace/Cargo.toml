[package]
name = "sapphire-framework-workspace"
edition.workspace = true
version.workspace = true
description = "Workspace management library for indexing and search of file-based documents"
license.workspace = true
repository.workspace = true
keywords = ["workspace", "markdown", "search", "index"]
categories = ["filesystem", "database"]

[features]
default = ["redb-store"]
# Pure-Rust cache backend (redb + tantivy). Default; no SQLite/libsqlite3-sys.
redb-store = ["sapphire-retrieve/redb-store"]
# `WorkspaceState::set_embedder_for_test`, for other crates' tests.
test-util = []

[dependencies]
sapphire-retrieve = { package = "sapphire-framework-retrieve", version = "0.14.0", path = "../sapphire-framework-retrieve", default-features = false }
sapphire-track    = { package = "sapphire-framework-track", version = "0.14.0", path = "../sapphire-framework-track" }
# Embedding is the bridge's: `BridgeEmbedder` asks it over the control plane (no iroh here).
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "2.3.0", path = "../sapphire-framework-bridge-api" }
sapphire-ipc        = { package = "sapphire-framework-ipc", version = "0.14.0", path = "../sapphire-framework-ipc" }
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
indexmap.workspace = true
walkdir = "2"
dirs.workspace = true
uuid.workspace = true
chrono = { workspace = true }
md-5 = "0.11"
# Synced vector files (#187): content addresses, f16 values, a JSON header.
sha2.workspace = true
half = "2"
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
