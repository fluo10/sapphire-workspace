[package]
name = "sapphire-framework-service"
version.workspace = true
edition.workspace = true
description = "Register a sapphire-framework application with the OS service manager"
license.workspace = true
repository.workspace = true
keywords = ["service", "systemd", "launchd", "daemon"]
categories = ["command-line-utilities"]

[dependencies]
clap.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# `effective_uid()` reads `libc::geteuid` (Linux/unix effective uid); that symbol is Linux
# only, so the dependency is Linux only too.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
toml.workspace = true
