[package]
name = "sapphire-framework-bridge"
version.workspace = true
edition.workspace = true
description = "Host-wide sapphire daemon: device identity, workgroup authorization and a switchboard to app servers"
license.workspace = true
repository.workspace = true
keywords = ["bridge", "p2p", "iroh", "local-first"]
categories = ["network-programming"]

[features]
default = []
# The real peer transport. Off by default so a build that only needs the switchboard, or a
# test, does not compile iroh.
node = ["dep:iroh"]
# Run a relay server for a workgroup from inside this process. Off by default: a relay
# needs a publicly reachable address and a certificate, and most hosts have neither.
embedded-relay = ["dep:iroh-relay", "dep:rustls", "node"]
# Loopback transport and fixtures for tests.
test-util = []

[dependencies]
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "2.3.0", path = "../sapphire-framework-bridge-api", features = ["cli"] }
sapphire-bridge-client = { package = "sapphire-framework-bridge-client", version = "0.15.0", path = "../sapphire-framework-bridge-client" }
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.15.0", path = "../sapphire-framework-ipc" }
sapphire-registry = { package = "sapphire-framework-registry", version = "0.15.0", path = "../sapphire-framework-registry" }
sapphire-framework-session = { version = "0.15.0", path = "../sapphire-framework-session" }
sapphire-framework-service = { version = "0.15.0", path = "../sapphire-framework-service" }
sapphire-sync = { package = "sapphire-framework-sync", version = "0.15.0", path = "../sapphire-framework-sync" }
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
data-encoding = "2"
dirs.workspace = true
getrandom.workspace = true
grain-id.workspace = true
notify = "8"
postcard = { version = "1", features = ["use-std"] }
subtle = "2"
iroh = { version = "1.2", optional = true }
# The relay *server*, compiled only behind `embedded-relay`. The `server` feature is the
# part that serves; it brings iroh-relay's own TLS stack (`tls-ring`) with it. iroh itself
# depends on this crate with no features, so the server code exists in a build only when
# this feature turns it on.
iroh-relay = { version = "1.2", default-features = false, features = ["server"], optional = true }
# The relay server takes a ready [`rustls::ServerConfig`] for manually supplied
# certificates, which is what a self-hosted relay has.
rustls = { version = "0.23", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
# The registry and the filters are what turn a writer into a layer: `registry` is what
# `LayeredSubscriber` needs, `env-filter` is what `EnvFilter` exists behind.
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
sapphire-framework-bridge = { path = ".", features = ["test-util"] }
tempfile = "3"
