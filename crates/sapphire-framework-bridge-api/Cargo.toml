[package]
name = "sapphire-framework-bridge-api"
# The major is the bridge's API version (`API_VERSION`); it moves only when the methods
# or their types break, not with the framework's version.
version = "2.3.0"
edition.workspace = true
description = "Control-plane protocol and client for the sapphire-framework bridge"
license.workspace = true
repository.workspace = true
keywords = ["bridge", "ipc", "protocol", "local-first"]
categories = ["network-programming"]

[features]
# The `embedding` subcommands both CLIs share.
cli = ["dep:clap", "dep:rpassword"]

[dependencies]
clap = { workspace = true, optional = true }
rpassword = { version = "7", optional = true }
grain-id.workspace = true
serde.workspace = true

[dev-dependencies]
clap.workspace = true
serde_json.workspace = true
