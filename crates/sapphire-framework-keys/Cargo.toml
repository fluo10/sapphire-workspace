[package]
name = "sapphire-framework-keys"
version.workspace = true
edition.workspace = true
description = "Bearer-token authentication against the workgroup's external devices, for sapphire-framework apps"
license.workspace = true
repository.workspace = true
keywords = ["auth", "api-keys", "bearer-token"]
categories = ["authentication"]

[features]
default = []
axum = ["dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
async-trait.workspace = true
grain-id.workspace = true
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "2.3.0", path = "../sapphire-framework-bridge-api" }
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.14.0", path = "../sapphire-framework-ipc" }
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http-body-util = "0.1"
# The verifier test runs a real bridge.
sapphire-framework-bridge = { path = "../sapphire-framework-bridge", features = ["test-util"] }

[dev-dependencies.axum]
workspace = true
features = ["http1", "json", "tokio"]
