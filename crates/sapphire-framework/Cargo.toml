[package]
name = "sapphire-framework"
version.workspace = true
edition.workspace = true
description = "Local-first framework for file-based workspaces — single-dependency facade over the sapphire-framework-* crates"
license.workspace = true
repository.workspace = true
keywords = ["local-first", "workspace", "search", "sync"]
categories = ["filesystem", "database"]

# Facade crate (bevy-style): depend on this one crate and enable features for the
# pieces you need. Each feature exposes an internal crate as a module
# (`sapphire_framework::workspace`, `::backend`, `::keys`, …). The internal
# `sapphire-framework-*` crates stay split for compile isolation.
[features]
default = ["workspace", "redb-store"]

# ── modules ──────────────────────────────────────────────────────────────────
workspace = ["dep:sapphire-framework-workspace"]
retrieve = ["dep:sapphire-framework-retrieve"]
track = ["dep:sapphire-framework-track"]
sync = ["dep:sapphire-framework-sync"]
session = ["dep:sapphire-framework-session"]
ipc = ["dep:sapphire-framework-ipc"]
server = ["dep:sapphire-framework-server", "backend"]
registry = ["dep:sapphire-framework-registry"]
bridge = ["dep:sapphire-framework-bridge"]
# The bridge's embedding component (local Qwen3-VL via candle, or REST). For apps that embed
# the bridge in-process (mobile). Heavy, so not in `native`.
bridge-embed = ["bridge", "dep:sapphire-framework-bridge-embed"]
backend = ["dep:sapphire-framework-backend", "workspace"]
gui = ["dep:sapphire-framework-gui", "backend"]
keys = ["dep:sapphire-framework-keys", "sapphire-framework-keys/axum"]
service = ["dep:sapphire-framework-service"]

# Everything usable on a native host.
native = ["workspace", "backend", "server", "bridge", "registry", "service"]

# ── store / embedding passthrough (apply to whichever crates are enabled) ─────
redb-store = [
    "sapphire-framework-workspace?/redb-store",
    "sapphire-framework-backend?/redb-store",
]
fastembed-embed = ["sapphire-framework-workspace?/fastembed-embed"]

[dependencies]
sapphire-framework-workspace = { version = "0.14.0", path = "../sapphire-framework-workspace", optional = true, default-features = false }
sapphire-framework-retrieve = { version = "0.14.0", path = "../sapphire-framework-retrieve", optional = true, default-features = false }
sapphire-framework-track = { version = "0.14.0", path = "../sapphire-framework-track", optional = true }
sapphire-framework-sync = { version = "0.14.0", path = "../sapphire-framework-sync", optional = true }
sapphire-framework-session = { version = "0.14.0", path = "../sapphire-framework-session", optional = true }
sapphire-framework-ipc = { version = "0.14.0", path = "../sapphire-framework-ipc", optional = true }
sapphire-framework-server = { version = "0.14.0", path = "../sapphire-framework-server", optional = true }
sapphire-framework-registry = { version = "0.14.0", path = "../sapphire-framework-registry", optional = true }
sapphire-framework-bridge = { version = "0.14.0", path = "../sapphire-framework-bridge", optional = true }
sapphire-framework-bridge-embed = { version = "0.14.0", path = "../sapphire-framework-bridge-embed", optional = true }
sapphire-framework-backend = { version = "0.14.0", path = "../sapphire-framework-backend", optional = true, default-features = false }
sapphire-framework-gui = { version = "0.14.0", path = "../sapphire-framework-gui", optional = true }
sapphire-framework-keys = { version = "0.14.0", path = "../sapphire-framework-keys", optional = true }
sapphire-framework-service = { version = "0.14.0", path = "../sapphire-framework-service", optional = true }
