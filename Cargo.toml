[workspace]
resolver = "3"
members = [
    "crates/sapphire-framework-track",
    "crates/sapphire-framework-sync",
    "crates/sapphire-framework-retrieve",
    "crates/sapphire-framework-workspace",
    "crates/sapphire-framework-rpc",
    "crates/sapphire-framework-blob",
    "crates/sapphire-framework-remote-server",
    "crates/sapphire-framework-remote-client",
    "crates/sapphire-framework-registry",
    "crates/sapphire-framework-backend",
    "crates/sapphire-framework-gui",
    "crates/sapphire-framework",
]

[workspace.package]
version = "0.14.0"
description = "Local-first, file-based workspace framework made for human-agent collaboration - indexing, search and sync over plain-text files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fluo10/sapphire-framework"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
indexmap = { version = "2", features = ["serde"] }
rmcp = { version = "1.2", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
dirs = "7"
getrandom = "0.4"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11"
redb = "4"
walkdir = "2"
tower = "0.5"
grain-id = { version = "0.16", features = ["serde"] }

[profile.dev.package."*"]
opt-level = 1
